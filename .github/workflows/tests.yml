name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: Homebrew/actions/setup-homebrew@main

      - uses: actions/checkout@v7

      - name: Check for formulae
        id: formulae
        run: |
          if ls Formula/*.rb > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tap this repository
        if: steps.formulae.outputs.present == 'true'
        run: |
          mkdir -p "$(brew --repository mfcollins3/tap)"
          rsync -a --delete ./ "$(brew --repository mfcollins3/tap)/"

      - name: Style, audit, install and test
        if: steps.formulae.outputs.present == 'true'
        run: |
          set -euo pipefail
          for f in Formula/*.rb; do
            name=$(basename "$f" .rb)
            brew style "mfcollins3/tap/$name"
            brew audit --strict --online "mfcollins3/tap/$name"
            brew install "mfcollins3/tap/$name"
            brew test "mfcollins3/tap/$name"
          done
